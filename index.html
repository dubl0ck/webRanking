<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Ranking de Atletas</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>🏃 Ranking de Atletas</h1>

  <!-- Formulario -->
  <form id="add-result-form">
    <input type="text" id="athlete-name" placeholder="Nombre del atleta" required>
    <input type="number" step="0.01" id="athlete-time" placeholder="Tiempo (s)" required>
    <button type="submit">Añadir resultado</button>
  </form>

  <!-- Ranking -->
  <div id="ranking">Cargando...</div>

  <script type="module" src="app.js"></script>
</body>
</html>
